<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: var(--ds-font-sans); font-weight: 700; font-size: 16px; border-radius: 999px; padding: 14px 28px; border: 0; cursor: pointer; transition: background var(--ds-dur-fast); }
  .btn-primary { background: var(--ds-blue); color: #fff; }
  .btn-primary:hover { background: var(--ds-blue-press); }
  .btn-secondary { background: #fff; color: var(--ds-blue); border: 1px solid var(--ds-blue); }
  .btn-secondary:hover { background: var(--ds-blue-softer); }
  .btn-tertiary { background: transparent; color: var(--ds-blue); padding: 14px 8px; }
  .btn-disabled { background: #C4CBDB; color: #fff; cursor: not-allowed; }
  .btn-sm { padding: 8px 18px; font-size: 14px; }
  .btn-pill-outline { background:#fff; color: var(--ds-blue); border: 1px solid var(--ds-blue); padding: 8px 16px; font-size: 14px; }
  .stack { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head><body class="card">
<div class="surface" style="padding:18px;">
<div class="ds-overline" style="margin-bottom:8px">Primary actions — pill, weight 700</div>
<div class="stack">
  <button class="btn btn-primary">Add customer</button>
  <button class="btn btn-secondary">Import contact</button>
  <button class="btn btn-disabled">Confirm</button>
</div>
<div class="ds-overline" style="margin:18px 0 8px">Small / inline</div>
<div class="stack">
  <button class="btn btn-sm btn-primary">Upgrade</button>
  <button class="btn btn-sm btn-pill-outline">Get £100</button>
  <button class="btn btn-tertiary">Learn more ›</button>
</div>
<div class="ds-overline" style="margin:18px 0 8px">With icon</div>
<div class="stack">
  <button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Create an invoice
  </button>
</div>
</div>
</body></html>
