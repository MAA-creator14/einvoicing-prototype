<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .s-row { display:flex; align-items:center; gap:12px; padding:6px 0; }
  .s-row .name { width:36px; font-weight:700; font-size:12px; color:var(--ds-ink-2); }
  .s-row .px { font-family:var(--ds-font-mono); font-size:11px; color:var(--ds-ink-3); width:46px; }
  .s-row .bar { background:var(--ds-blue); height:14px; border-radius:4px; }
</style>
</head><body class="card">
<div class="surface" style="padding:14px 18px;">
<div class="s-row"><span class="name">1</span><span class="px">4px</span><span class="bar" style="width:4px"></span></div>
<div class="s-row"><span class="name">2</span><span class="px">8px</span><span class="bar" style="width:8px"></span></div>
<div class="s-row"><span class="name">3</span><span class="px">12px</span><span class="bar" style="width:12px"></span></div>
<div class="s-row"><span class="name">4</span><span class="px">16px</span><span class="bar" style="width:16px"></span></div>
<div class="s-row"><span class="name">5</span><span class="px">20px</span><span class="bar" style="width:20px"></span></div>
<div class="s-row"><span class="name">6</span><span class="px">24px</span><span class="bar" style="width:24px"></span></div>
<div class="s-row"><span class="name">8</span><span class="px">32px</span><span class="bar" style="width:32px"></span></div>
<div class="s-row"><span class="name">10</span><span class="px">40px</span><span class="bar" style="width:40px"></span></div>
<div class="s-row"><span class="name">12</span><span class="px">48px</span><span class="bar" style="width:48px"></span></div>
<div class="s-row"><span class="name">16</span><span class="px">64px</span><span class="bar" style="width:64px"></span></div>
</div>
</body></html>
