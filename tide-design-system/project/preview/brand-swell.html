<!doctype html>
<html><head><meta charset="utf-8"><title>Swell motif</title>
<link rel="stylesheet" href="_card.css">

    <g clip-path="url(#swcl)">

      <path d="M 600 60 L 660 60 L 460 340 L 400 340 Z" fill="#001A3D"/>

    </g>
  </svg>
  <div style="position:relative; z-index:2; padding:22px 24px;">
    <div style="font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; opacity:0.7; margin-bottom:8px;">The Swell ™</div>
    <div style="font-size:22px; font-weight:800; line-height:1.2; max-width:60%;">Trademarked chevron motif — reserved for the primary account card.</div>
  </div>
</div>
