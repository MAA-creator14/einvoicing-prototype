<!doctype html>
<html><head><meta charset="utf-8"><title>Logos</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
  <div style="background:#fff; padding: 28px 24px; border-radius: 20px; display:flex; align-items:center; justify-content:center; min-height: 110px;">
    <img src="../assets/Tide_Logo_Blue_RGB.svg" alt="Tide logo blue" style="height:42px;">
  </div>
  <div style="background:#00224F; padding: 28px 24px; border-radius: 20px; display:flex; align-items:center; justify-content:center; min-height: 110px;">
    <img src="../assets/Tide_Logo_White_RGB.svg" alt="Tide logo white" style="height:42px;">
  </div>
  <div style="background:#fff; padding: 22px 24px; border-radius: 20px; display:flex; align-items:center; justify-content:center; grid-column: span 2; min-height: 100px;">
    <img src="../assets/tide-dwyl.svg" alt="Tide — Do what you love" style="height:60px;">
  </div>
</div>
</body></html>
