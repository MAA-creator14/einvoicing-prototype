<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic states</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div class="grid-3">
  <div class="surface" style="display:flex;gap:10px;align-items:center;padding:14px;">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-success)"></span>
    <div style="flex:1">
      <div style="font-weight:700; font-size:14px;">Success</div>
      <div style="font-family:var(--ds-font-mono); font-size:11px; color:var(--ds-ink-3)">#1E8A5C</div>
    </div>
    <span style="background:var(--ds-success-bg); color:var(--ds-success); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;">Paid</span>
  </div>
  <div class="surface" style="display:flex;gap:10px;align-items:center;padding:14px;">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-warning)"></span>
    <div style="flex:1">
      <div style="font-weight:700; font-size:14px;">Warning</div>
      <div style="font-family:var(--ds-font-mono); font-size:11px; color:var(--ds-ink-3)">#B36900</div>
    </div>
    <span style="background:var(--ds-warning-bg); color:var(--ds-warning); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;">Pending</span>
  </div>
  <div class="surface" style="display:flex;gap:10px;align-items:center;padding:14px;">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-danger)"></span>
    <div style="flex:1">
      <div style="font-weight:700; font-size:14px;">Danger</div>
      <div style="font-family:var(--ds-font-mono); font-size:11px; color:var(--ds-ink-3)">#D32A3C</div>
    </div>
    <span style="background:var(--ds-danger-bg); color:var(--ds-danger); padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;">Failed</span>
  </div>
</div>
<div style="margin-top:16px;background:var(--ds-blue-soft); color:var(--ds-blue-deep); padding:12px 16px; border-radius:14px; font-size:13px; font-weight:600;">
  You paid £0.50 in FX fees. <span style="color:var(--ds-blue);text-decoration:underline">Upgrade for 0% FX fees</span>
</div>
<div style="margin-top:8px; display:flex; gap:10px; align-items:center;">
  <span style="width:18px;height:18px;border-radius:50%;background:var(--ds-notify);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;">5</span>
  <span class="muted">Notification dot · <span style="font-family:var(--ds-font-mono)">#E2273A</span></span>
</div>
</body></html>
