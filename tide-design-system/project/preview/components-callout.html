<!doctype html>
<html><head><meta charset="utf-8"><title>Callout banners</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div style="background:var(--ds-blue-soft); color:var(--ds-blue-deep); padding: 14px 16px; border-radius: 14px; font-size: 14px; font-weight: 600;">

  <svg width="78" height="78" viewBox="0 0 100 100">
    <rect x="14" y="10" width="60" height="80" fill="#4050FB"/>
    <circle cx="64" cy="54" r="14" fill="#5BC8B0"/>
    <rect x="56" y="74" width="22" height="10" fill="#00224F"/>
  </svg>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ds-ink-3)" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
</div>
