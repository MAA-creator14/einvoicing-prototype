<!doctype html>
<html><head><meta charset="utf-8"><title>Empty state illustration</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card" style="background:var(--ds-bg);">
<div style="display:flex; align-items:center; gap: 24px; padding: 8px 12px;">
  <!-- the cursor-on-document illustration, rebuilt -->
  <svg width="160" height="120" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
    <!-- back document -->
    <rect x="42" y="14" width="64" height="78" fill="#D5D9E3"/>
    <!-- front darker rect -->
    <rect x="20" y="46" width="36" height="46" fill="#9EA6BB"/>
    <!-- foot -->
    <rect x="14" y="86" width="20" height="6" fill="#0B1B3B"/>
    <!-- text bars on document -->
    <rect x="56" y="38" width="34" height="5" fill="#9EA6BB"/>
    <rect x="56" y="48" width="28" height="5" fill="#9EA6BB"/>
    <!-- cursor (light blue) -->
    <path d="M 96 36 L 96 70 L 105 62 L 111 76 L 117 73 L 111 60 L 121 60 Z" fill="#B6CCFF"/>
    <!-- card (dark blue) clipped to cursor -->
    <rect x="106" y="60" width="14" height="20" fill="#2B59FF" transform="rotate(20 113 70)"/>
  </svg>
  <div style="flex:1">
    <div style="font-size:17px; font-weight:700; color:var(--ds-ink); margin-bottom:6px; line-height:1.3;">Add or import a customer to see them here</div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button style="font:inherit; background:#fff; color:var(--ds-blue); border:1px solid var(--ds-blue); border-radius:999px; padding:8px 16px; font-weight:700; font-size:13px;">Import contact</button>
      <button style="font:inherit; background:var(--ds-blue); color:#fff; border:0; border-radius:999px; padding:8px 16px; font-weight:700; font-size:13px;">Add customer</button>
    </div>
  </div>
</div>
</body></html>
