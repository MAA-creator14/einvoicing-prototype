<!doctype html>
<html><head><meta charset="utf-8"><title>Type weights</title>
<link rel="stylesheet" href="_card.css">
<style>
  .w-row { display:grid; grid-template-columns: 90px 1fr 60px; align-items:baseline; gap:12px; padding:6px 0; border-bottom: 1px dashed var(--ds-divider); }
  .w-row:last-child { border-bottom:0; }
  .w-row .name { font-size:12px; color:var(--ds-ink-3); font-weight:600; }
  .w-row .ex { font-size:22px; letter-spacing:-0.01em; color:var(--ds-ink); }
  .w-row .num { font-family: var(--ds-font-mono); font-size:11px; color:var(--ds-ink-4); text-align:right; }
</style>
</head><body class="card">
<div class="surface" style="padding:18px 22px;">
  <div class="ds-overline" style="margin-bottom:8px">Weights</div>
  <div class="w-row"><span class="name">Regular</span><span class="ex" style="font-weight:400">Tide is for founders.</span><span class="num">400</span></div>
  <div class="w-row"><span class="name">Medium</span><span class="ex" style="font-weight:600">Tide is for founders.</span><span class="num">600</span></div>
  <div class="w-row"><span class="name">Semibold</span><span class="ex" style="font-weight:700">Tide is for founders.</span><span class="num">700</span></div>
  <div class="w-row"><span class="name">Bold</span><span class="ex" style="font-weight:800">Tide is for founders.</span><span class="num">800</span></div>
  <div class="w-row"><span class="name">Black</span><span class="ex" style="font-weight:900">Tide is for founders.</span><span class="num">900</span></div>
</div>
</body></html>
