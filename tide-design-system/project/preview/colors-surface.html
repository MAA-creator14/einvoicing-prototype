<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces & ink</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div class="grid-4">
  <div class="swatch" style="background:var(--ds-bg); color:var(--ds-ink); border:1px solid var(--ds-divider);">
    <div>Canvas</div><div class="hex">#F0F2F8</div>
  </div>
  <div class="swatch" style="background:var(--ds-bg-tint); color:var(--ds-ink); border:1px solid var(--ds-divider);">
    <div>Canvas tint</div><div class="hex">#E6E9F4</div>
  </div>
  <div class="swatch" style="background:var(--ds-surface); color:var(--ds-ink); border:1px solid var(--ds-divider);">
    <div>Surface</div><div class="hex">#FFFFFF</div>
  </div>
  <div class="swatch" style="background:var(--ds-surface-2); color:var(--ds-ink); border:1px solid var(--ds-divider);">
    <div>Surface 2</div><div class="hex">#F7F8FC</div>
  </div>
  <div class="swatch" style="background:var(--ds-ink); color:#fff;">
    <div>Ink</div><div class="hex">#0B1B3B</div>
  </div>
  <div class="swatch" style="background:var(--ds-ink-2); color:#fff;">
    <div>Ink 2</div><div class="hex">#283656</div>
  </div>
  <div class="swatch" style="background:var(--ds-ink-3); color:#fff;">
    <div>Ink 3</div><div class="hex">#5F6B85</div>
  </div>
  <div class="swatch" style="background:var(--ds-ink-4); color:#fff;">
    <div>Ink 4</div><div class="hex">#8A95AE</div>
  </div>
</div>
</body></html>
