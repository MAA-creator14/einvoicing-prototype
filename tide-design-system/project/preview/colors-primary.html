<!doctype html>
<html><head><meta charset="utf-8"><title>Primary blues</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div class="grid-4">
  <div class="swatch" style="background:var(--ds-blue-deep); color:#fff;">
    <div>Deep navy</div><div class="hex">#00224F</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue); color:#fff;">
    <div>Electric blue</div><div class="hex">#2B59FF</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue-logo); color:#fff;">
    <div>Logo blue</div><div class="hex">#4050FB</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue-press); color:#fff;">
    <div>Press blue</div><div class="hex">#1C3FCC</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue-soft); color:var(--ds-blue-deep);">
    <div>Soft tint</div><div class="hex">#D6E0FF</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue-softer); color:var(--ds-blue-deep);">
    <div>Softer tint</div><div class="hex">#EDF1FF</div>
  </div>
  <div class="swatch" style="background:var(--ds-blue-deep-2); color:#fff;">
    <div>Swell shadow</div><div class="hex">#001A3D</div>
  </div>
  <div class="swatch" style="background:#0A2E66; color:#fff;">
    <div>Swell highlight</div><div class="hex">#0A2E66</div>
  </div>
</div>
</body></html>
