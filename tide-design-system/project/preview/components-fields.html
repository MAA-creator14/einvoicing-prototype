<!doctype html>
<html><head><meta charset="utf-8"><title>Form fields</title>
<link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom: 14px; }
  .field label { font-size: 15px; font-weight: 700; color: var(--ds-ink); }
  .field input, .field select {
    background: #fff; border: 0; border-radius: 14px; padding: 18px 18px;
    font-family: var(--ds-font-sans); font-size: 16px; color: var(--ds-ink);
    appearance: none; outline: 0;
  }
  .field input::placeholder { color: var(--ds-ink-4); }
  .field input:focus, .field select:focus { box-shadow: 0 0 0 2px var(--ds-blue); }
  .select-wrap { position: relative; }
  .select-wrap svg { position:absolute; right:18px; top:50%; transform:translateY(-50%); pointer-events:none; }
</style>
</head><body class="card" style="background:var(--ds-bg);">
<div class="field">
  <label>Item description</label>
  <input placeholder="Max 1000 characters">
</div>
<div class="field">
  <label>Quantity</label>
  <input value="1">
</div>
<div class="field">
  <label>Unit type <span style="color:var(--ds-ink-3); font-weight:400">— optional</span></label>
  <div class="select-wrap">
    <select><option>Units</option></select>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2B59FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
</div>
</body></html>
