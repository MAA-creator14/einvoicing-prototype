<!doctype html>
<html><head><meta charset="utf-8"><title>Illustration palette</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div class="surface" style="padding:18px;">
  <div class="ds-overline" style="margin-bottom:6px">Used only in flat illustrations</div>
  <div class="ds-body-sm" style="margin-bottom:14px">A tightly limited 4‑colour set — no gradients, no strokes.</div>
  <div class="grid-4">
    <div class="swatch" style="background:var(--ds-blue-logo); color:#fff;">
      <div>Blue</div><div class="hex">#4050FB</div>
    </div>
    <div class="swatch" style="background:var(--ds-blue-deep); color:#fff;">
      <div>Deep navy</div><div class="hex">#00224F</div>
    </div>
    <div class="swatch" style="background:var(--ds-mint); color:#003C2E;">
      <div>Mint</div><div class="hex">#5BC8B0</div>
    </div>
    <div class="swatch" style="background:#B8BFD1; color:#1B233B;">
      <div>Warm grey</div><div class="hex">#B8BFD1</div>
    </div>
  </div>
</div>
</body></html>
