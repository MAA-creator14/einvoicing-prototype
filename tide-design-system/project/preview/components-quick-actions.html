<!doctype html>
<html><head><meta charset="utf-8"><title>Quick actions</title>
<link rel="stylesheet" href="_card.css">
<style>
  .qa { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .qa .disc { width:64px; height:64px; border-radius:50%; background: var(--ds-blue); display:inline-flex; align-items:center; justify-content:center; }
  .qa .label { font-weight:700; font-size:14px; color: var(--ds-ink); }
  .qa-row { display:flex; gap:16px; padding: 14px 4px; }
</style>
</head><body class="card" style="background:var(--ds-bg);">
<div class="qa-row">
  <div class="qa">
    <div class="disc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>
    <div class="label">Send</div>
  </div>
  <div class="qa">
    <div class="disc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div>
    <div class="label">Get paid</div>
  </div>
  <div class="qa">
    <div class="disc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="10" height="14" rx="2"/><rect x="13" y="3" width="8" height="11" rx="2"/></svg></div>
    <div class="label">Card reader</div>
  </div>
  <div class="qa">
    <div class="disc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="2" y1="11" x2="22" y2="11"/></svg></div>
    <div class="label">Cards</div>
  </div>
</div>
</body></html>
