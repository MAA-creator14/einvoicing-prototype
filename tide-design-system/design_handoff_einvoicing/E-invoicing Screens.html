<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tide · E-invoicing screens</title>
<link rel="stylesheet" href="tide-tokens.css"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ds-bg); }
  body { font-family: var(--ds-font-sans); color: var(--ds-ink); -webkit-font-smoothing: antialiased; }

  @keyframes tideSpin { to { transform: rotate(360deg); } }
  @keyframes tidePulse {
    0%   { transform: scale(0.85); opacity: 0.5; }
    70%  { transform: scale(1.6);  opacity: 0;   }
    100% { transform: scale(1.6);  opacity: 0;   }
  }
  @keyframes tideShimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%);  }
  }

  button:focus-visible {
    outline: 2px solid var(--ds-blue);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tide-components.jsx"></script>
<script type="text/babel" src="e-invoicing-screens.jsx"></script>
</body>
</html>
